<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailMate - Indian Railways Assistant</title>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-dark: #1e40af;
            --secondary-color: #1e293b;
            --bg-color: #f0f9ff;
            --chat-bg: #ffffff;
            --user-msg-bg: #dbeafe;
            --bot-msg-bg: #f1f5f9;
            --text-color: #333;
            --shadow: 0 4px 6px -1px rgba(0,0,0,.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 501px) {
            .app-container {
                height: 90vh;
                border-radius: 12px;
            }
        }

        /* Intro animation */

        #intro-layer {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .5s ease;
        }

        .intro-track {
            width: 100%;
            height: 20px;
            background: #b0bec5;
            position: absolute;
            bottom: 20%;
            background-image: repeating-linear-gradient(
                90deg,
                #546e7a 0px,
                #546e7a 20px,
                transparent 20px,
                transparent 35px
            );
            border-top: 4px solid #78909c;
            border-bottom: 4px solid #78909c;
        }

        .intro-train {
            position: absolute;
            bottom: 20%;
            left: -350px;
            width: 200px;
            height: 80px;
            display: flex;
            align-items: flex-end;
        }

        .engine-body {
            width: 160px;
            height: 70px;
            background: var(--primary-color);
            border-radius: 10px 30px 5px 5px;
            position: relative;
            box-shadow: 4px 8px 12px rgba(0,0,0,.2);
        }

        .engine-body::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            width: 40px;
            height: 25px;
            background: #81d4fa;
            border: 3px solid #0d47a1;
            border-radius: 4px;
        }

        .engine-cabin {
            position: absolute;
            right: -20px;
            bottom: 0;
            width: 40px;
            height: 65px;
            background: #f4511e;
            border-radius: 0 5px 5px 0;
        }

        .intro-name-plate {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            white-space: nowrap;
            z-index: 2;
        }

        .intro-wheel {
            width: 30px;
            height: 30px;
            background: #222;
            border: 1px solid #000;
            border-radius: 50%;
            position: absolute;
            bottom: -15px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-rim {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
            border: 2px solid #616161;
            position: relative;
        }

        .wheel-rim::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #424242;
            border-radius: 50%;
        }

        .wheel-back { left: 25px; }
        .wheel-front { right: 25px; }

        @keyframes driveIntroTrain {
            0% { left: -350px; transform: scale(.9); }
            10%, 90% { transform: scale(1); }
            100% { left: 110%; transform: scale(.9); }
        }

        @keyframes rotateWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Chat interface */

        #chat-interface {
            flex: 1;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity .8s ease;
            min-height: 0;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,.2);
            z-index: 10;
            transform: translateY(-100%);
        }

        header.visible {
            animation: slideDown .8s cubic-bezier(.25,1,.5,1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-info h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .header-info p {
            font-size: .8rem;
            opacity: .9;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            background-image: radial-gradient(#e3f2fd 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message {
            max-width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: .95rem;
            line-height: 1.4;
            position: relative;
            animation: fadeIn .4s ease;
            overflow-wrap: anywhere;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg-bg);
            border-bottom-left-radius: 2px;
            color: var(--text-color);
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
            color: var(--secondary-color);
        }

        .typing {
            font-size: .8rem;
            color: #888;
            margin: 0 10px 8px;
            display: none;
            font-style: italic;
        }

        /* Buttons */

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .option-chip {
            background: white;
            border: 1px solid #ccc;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: .85rem;
            cursor: pointer;
            color: var(--secondary-color);
            transition: all .2s;
        }

        .option-chip:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* FAQs */

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .faq-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .faq-question {
            padding: 12px;
            font-weight: 600;
            color: var(--secondary-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .9rem;
        }

        .faq-question::after {
            content: '+';
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .faq-item.active .faq-question::after {
            content: '-';
        }

        .faq-answer {
            display: none;
            padding: 10px 12px 12px;
            color: #555;
            font-size: .85rem;
            line-height: 1.5;
            border-top: 1px dashed #eee;
            background: #fafafa;
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        /* Train table */

        .bus-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .82rem;
            margin-top: 10px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
        }

        .bus-table th {
            background: var(--primary-color);
            color: white;
            padding: 10px 6px;
            text-align: left;
        }

        .bus-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .bus-table tbody tr {
            cursor: pointer;
            transition: background-color .2s;
        }

        .bus-table tbody tr:hover {
            background: #f0f9ff;
        }

        .route-text {
            font-weight: 600;
            color: var(--secondary-color);
            font-size: .88rem;
        }

        .via-text {
            display: block;
            font-size: .75rem;
            color: #666;
            margin-top: 3px;
        }

        .click-hint {
            display: block;
            font-size: .7rem;
            color: var(--primary-color);
            margin-top: 4px;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: .68rem;
            font-weight: bold;
        }

        .badge-express {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-superfast {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Input */

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: none;
            opacity: 0;
            gap: 10px;
            align-items: center;
            transition: opacity .5s ease;
            z-index: 20;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button#send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 45px;
            min-width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button#send-btn:hover {
            background: var(--primary-dark);
        }

        button#send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .district-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .district-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 6px;
            font-size: .85rem;
            text-align: center;
            cursor: pointer;
        }

        .district-btn:hover {
            background: #dbeafe;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .error-text {
            color: #b91c1c;
            font-size: .88rem;
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- Train intro animation -->
    <div id="intro-layer">
        <div class="intro-track"></div>

        <div class="intro-train" id="anim-train">
            <div class="engine-body">
                <div class="intro-name-plate">RailMate</div>
            </div>

            <div class="engine-cabin"></div>

            <div class="intro-wheel wheel-back">
                <div class="wheel-rim"></div>
            </div>

            <div class="intro-wheel wheel-front">
                <div class="wheel-rim"></div>
            </div>
        </div>
    </div>

    <!-- Chat interface -->
    <div id="chat-interface">

        <header id="main-header">
            <div class="header-info">
                <h1>RailMate Assistant</h1>
                <p>Online | Indian Railways Enquiry</p>
            </div>
        </header>

        <main id="chat-window"></main>

        <div class="typing" id="typing-indicator">
            RailMate is connecting to the train database...
        </div>

    </div>

    <!-- Input area -->
    <div class="input-area" id="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Type a state or ask for help..."
            autocomplete="off"
        >

        <button id="send-btn" aria-label="Send Message">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>

</div>

<script>
"use strict";

/* =====================================================
   1. AWS API CONFIGURATION
   ===================================================== */

const API_BASE =
    "https://6yo3y5i6gd.execute-api.ap-south-1.amazonaws.com";

/* =====================================================
   2. FAQ DATA
   ===================================================== */

const allFaqs = [
    {
        q: "How to book tickets online?",
        a: "You can book tickets through the official IRCTC website or the IRCTC Rail Connect app."
    },
    {
        q: "What is the cancellation charge?",
        a: "Cancellation charges depend on the ticket class, booking status and time of cancellation. Check the official IRCTC rules."
    },
    {
        q: "Can I travel with a waitlisted ticket?",
        a: "Rules depend on whether the ticket is an e-ticket or counter ticket and its status. Check the current railway rules before travelling."
    },
    {
        q: "How to check PNR status?",
        a: "Check your PNR using official railway enquiry services or the IRCTC app."
    },
    {
        q: "What is Tatkal booking?",
        a: "Tatkal is a quota for eligible last-minute bookings. Check IRCTC for current booking times and rules."
    },
    {
        q: "Is home delivery of tickets available?",
        a: "Most online bookings use electronic tickets. Check the relevant booking service for available options."
    },
    {
        q: "Are pets allowed in trains?",
        a: "Rules depend on the animal, train and class of travel. Confirm arrangements with Indian Railways before travelling."
    },
    {
        q: "What if I miss my train?",
        a: "Refund eligibility depends on your ticket and railway rules. Check the official refund and TDR policies."
    },
    {
        q: "Is there a senior citizen concession?",
        a: "Concession availability can change. Check current Indian Railways rules when booking."
    },
    {
        q: "Do trains run on time?",
        a: "Train running times can change. Check official live train status before departure."
    }
];

/* =====================================================
   3. STATE LIST
   ===================================================== */

const states = [
    "Maharashtra",
    "Karnataka",
    "Delhi",
    "Tamil Nadu",
    "Andhra Pradesh",
    "Gujarat",
    "Kerala",
    "West Bengal",
    "Rajasthan",
    "Uttar Pradesh",
    "Madhya Pradesh",
    "Bihar",
    "Goa"
];

/* =====================================================
   4. APPLICATION STATE
   ===================================================== */

let bookingState = "IDLE";
let selectedRoute = null;
let requestInProgress = false;

/* =====================================================
   5. DOM ELEMENTS
   ===================================================== */

const introLayer = document.getElementById("intro-layer");
const animTrain = document.getElementById("anim-train");
const chatInterface = document.getElementById("chat-interface");
const mainHeader = document.getElementById("main-header");
const chatWindow = document.getElementById("chat-window");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const typingIndicator = document.getElementById("typing-indicator");
const inputArea = document.getElementById("input-area");

/* =====================================================
   6. GENERAL CHAT HELPERS
   ===================================================== */

function appendMessage(text, sender, isHtml = false) {
    const msgDiv = document.createElement("div");

    msgDiv.classList.add("message", sender);

    if (isHtml) {
        msgDiv.innerHTML = text;
    } else {
        msgDiv.textContent = text;
    }

    chatWindow.appendChild(msgDiv);
    scrollToBottom();

    return msgDiv;
}

function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function showTyping() {
    typingIndicator.style.display = "block";
    scrollToBottom();
}

function hideTyping() {
    typingIndicator.style.display = "none";
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

/* =====================================================
   7. FAQ INTERACTIONS
   ===================================================== */

function renderFAQs() {
    const shuffled = [...allFaqs].sort(() => Math.random() - 0.5);
    const selectedFaqs = shuffled.slice(0, 8);

    appendMessage(
        "Here are some frequently asked questions. Tap a question to see the answer:",
        "bot"
    );

    const faqMsg = document.createElement("div");
    faqMsg.classList.add("message", "bot");

    const faqList = document.createElement("div");
    faqList.classList.add("faq-list");

    selectedFaqs.forEach(item => {
        const faqItem = document.createElement("div");
        faqItem.classList.add("faq-item");

        const question = document.createElement("div");
        question.classList.add("faq-question");
        question.textContent = item.q;

        const answer = document.createElement("div");
        answer.classList.add("faq-answer");
        answer.textContent = item.a;

        question.addEventListener("click", () => {
            const wasActive = faqItem.classList.contains("active");

            faqList.querySelectorAll(".faq-item").forEach(element => {
                element.classList.remove("active");
            });

            if (!wasActive) {
                faqItem.classList.add("active");
            }
        });

        faqItem.appendChild(question);
        faqItem.appendChild(answer);
        faqList.appendChild(faqItem);
    });

    faqMsg.appendChild(faqList);
    chatWindow.appendChild(faqMsg);

    scrollToBottom();
}

/* =====================================================
   8. STATE BUTTONS
   ===================================================== */

function renderStateChips() {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", "bot");

    msgDiv.appendChild(
        document.createTextNode("Select a destination state or get help:")
    );

    const optionsDiv = document.createElement("div");
    optionsDiv.classList.add("options-container");

    const popularStates = [
        "Maharashtra",
        "Karnataka",
        "Delhi",
        "Tamil Nadu",
        "Andhra Pradesh",
        "Gujarat"
    ];

    popularStates.forEach(state => {
        const button = document.createElement("button");

        button.classList.add("option-chip");
        button.textContent = state;

        button.addEventListener("click", () => {
            userInput.value = state;
            processUserMessage();
        });

        optionsDiv.appendChild(button);
    });

    const viewAllButton = document.createElement("button");

    viewAllButton.classList.add("option-chip");
    viewAllButton.textContent = "View All States...";

    viewAllButton.addEventListener("click", showAllStatesGrid);

    optionsDiv.appendChild(viewAllButton);

    const faqButton = document.createElement("button");

    faqButton.classList.add("option-chip");
    faqButton.textContent = "FAQ / Questions";

    faqButton.addEventListener("click", () => {
        userInput.value = "faq";
        processUserMessage();
    });

    optionsDiv.appendChild(faqButton);

    msgDiv.appendChild(optionsDiv);
    chatWindow.appendChild(msgDiv);

    scrollToBottom();
}

function showAllStatesGrid() {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", "bot");

    const heading = document.createElement("strong");
    heading.textContent = "Select a state:";

    msgDiv.appendChild(heading);

    const grid = document.createElement("div");
    grid.classList.add("district-grid");

    states.forEach(state => {
        const button = document.createElement("button");

        button.classList.add("district-btn");
        button.textContent = state;

        button.addEventListener("click", () => {
            userInput.value = state;
            processUserMessage();
        });

        grid.appendChild(button);
    });

    msgDiv.appendChild(grid);
    chatWindow.appendChild(msgDiv);

    scrollToBottom();
}

/* =====================================================
   9. NORMALIZE API RESPONSE
   ===================================================== */

function normalizeTrain(train) {
    const trainNumber = train.trainNo ?? train.num ?? train.trainNumber;

    const priceValue = train.price ?? train.fare;

    const parsedPrice = Number(priceValue);

    return {
        name: String(train.name ?? "Unknown Train"),
        num: String(trainNumber ?? ""),
        time: String(train.time ?? train.departureTime ?? "Not available"),
        dest: String(train.dest ?? train.to ?? train.destination ?? "Not available"),
        price: Number.isFinite(parsedPrice) && parsedPrice >= 0
            ? parsedPrice
            : null,
        type: String(train.type ?? "Express")
    };
}

/* =====================================================
   10. GET TRAIN DATA FROM AWS
   ===================================================== */

async function showTrainTimingsForState(state) {
    if (requestInProgress) {
        return;
    }

    requestInProgress = true;
    showTyping();

    try {
        const url =
            `${API_BASE}/trains?state=${encodeURIComponent(state)}`;

        console.log("RailMate API request:", url);

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });

        console.log("RailMate API status:", response.status);

        const responseText = await response.text();

        if (!response.ok) {
            throw new Error(
                `API returned HTTP ${response.status}: ${responseText.slice(0, 200)}`
            );
        }

        let result;

        try {
            result = JSON.parse(responseText);
        } catch {
            throw new Error("The API did not return valid JSON.");
        }

        let trainList;

        if (Array.isArray(result)) {
            trainList = result;
        } else if (Array.isArray(result.Items)) {
            trainList = result.Items;
        } else if (Array.isArray(result.items)) {
            trainList = result.items;
        } else if (Array.isArray(result.trains)) {
            trainList = result.trains;
        } else if (Array.isArray(result.data)) {
            trainList = result.data;
        } else {
            console.error("Unexpected API response:", result);

            throw new Error(
                "The API response format was not recognized. Check the Lambda response."
            );
        }

        const data = trainList
            .filter(train => train && typeof train === "object")
            .map(normalizeTrain)
            .filter(train => {
                return train.num.length > 0;
            });

        hideTyping();

        if (data.length === 0) {
            appendMessage(
                `No train records were found for ${state} in the database. Try another state or check the train records in AWS.`,
                "bot"
            );

            return;
        }

        renderTrainTable(state, data);

    } catch (error) {
        console.error("RailMate AWS API error:", error);

        hideTyping();

        appendMessage(
            `Unable to load train information. ${error.message}`,
            "bot"
        );

        appendMessage(
            "Check that your API works, the Lambda supports the state query, and API Gateway CORS allows this website's origin.",
            "bot"
        );

    } finally {
        requestInProgress = false;
        hideTyping();
    }
}

/* =====================================================
   11. DISPLAY TRAINS
   ===================================================== */

function renderTrainTable(state, data) {
    appendMessage(
        `Here are the train records returned by AWS for ${state}. Select a train to view its stored fare:`,
        "bot"
    );

    const tableMsg = document.createElement("div");
    tableMsg.classList.add("message", "bot");

    const title = document.createElement("div");

    title.style.textAlign = "center";
    title.style.marginBottom = "8px";
    title.style.fontWeight = "bold";
    title.style.color = "var(--primary-color)";
    title.textContent = `Trains for ${state}`;

    tableMsg.appendChild(title);

    const table = document.createElement("table");
    table.classList.add("bus-table");

    table.innerHTML = `
        <thead>
            <tr>
                <th style="width:70px">Time</th>
                <th>Train Info</th>
                <th style="width:75px">Type</th>
            </tr>
        </thead>
        <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    data.forEach(train => {
        const tr = document.createElement("tr");

        const timeCell = document.createElement("td");
        timeCell.style.whiteSpace = "nowrap";
        timeCell.textContent = train.time;

        const infoCell = document.createElement("td");

        const name = document.createElement("div");
        name.classList.add("route-text");
        name.textContent = `${train.name} (${train.num})`;

        const destination = document.createElement("span");
        destination.classList.add("via-text");
        destination.textContent = `To: ${train.dest}`;

        const hint = document.createElement("span");
        hint.classList.add("click-hint");
        hint.textContent = "Tap for price";

        infoCell.appendChild(name);
        infoCell.appendChild(destination);
        infoCell.appendChild(hint);

        const typeCell = document.createElement("td");

        const badge = document.createElement("span");
        badge.classList.add("badge");

        if (train.type.trim().toLowerCase() === "superfast") {
            badge.classList.add("badge-superfast");
        } else {
            badge.classList.add("badge-express");
        }

        badge.textContent = train.type;

        typeCell.appendChild(badge);

        tr.appendChild(timeCell);
        tr.appendChild(infoCell);
        tr.appendChild(typeCell);

        tr.addEventListener("click", () => {
            handleRouteClick(train);
        });

        tbody.appendChild(tr);
    });

    tableMsg.appendChild(table);

    const note = document.createElement("div");

    note.style.fontSize = ".75rem";
    note.style.color = "#666";
    note.style.marginTop = "8px";
    note.style.textAlign = "center";

    note.textContent =
        "Train details and fares are based on your database records.";

    tableMsg.appendChild(note);

    chatWindow.appendChild(tableMsg);
    scrollToBottom();
}

/* =====================================================
   12. TRAIN SELECTION AND PRICE CALCULATION
   ===================================================== */

function handleRouteClick(route) {
    selectedRoute = route;
    bookingState = "AWAITING_MEMBER_COUNT";

    appendMessage(
        `You selected: ${route.name} (${route.num}) to ${route.dest}`,
        "user"
    );

    if (route.price === null) {
        appendMessage(
            "A valid fare is not available for this train in the database. Please update the train's price or fare field in DynamoDB.",
            "bot"
        );

        bookingState = "IDLE";
        selectedRoute = null;

        return;
    }

    appendMessage(
        `Stored ticket price: ₹${route.price} per person.`,
        "bot"
    );

    appendMessage(
        "How many members have to travel? Please enter a positive whole number.",
        "bot"
    );

    userInput.focus();
}

/* =====================================================
   13. CHATBOT RESPONSE HANDLER
   ===================================================== */

async function handleBotResponse(text) {
    const lowerText = text.toLowerCase().trim();

    if (bookingState === "AWAITING_MEMBER_COUNT") {
        const count = Number(text);

        if (
            text.trim() !== "" &&
            Number.isSafeInteger(count) &&
            count > 0
        ) {
            if (selectedRoute && selectedRoute.price !== null) {
                const total = count * selectedRoute.price;

                appendMessage(
                    `Total stored ticket price for ${count} members is ₹${total.toLocaleString("en-IN")}.`,
                    "bot"
                );

                appendMessage(
                    "Thank you for using RailMate! Have a safe journey. 🚆",
                    "bot"
                );

                bookingState = "IDLE";
                selectedRoute = null;

            } else {
                appendMessage(
                    "The fare is unavailable. Select another train with a stored fare.",
                    "bot"
                );
            }

        } else {
            appendMessage(
                "Please enter a valid positive whole number, such as 2 or 5.",
                "bot"
            );
        }

        return;
    }

    if (
        lowerText.includes("faq") ||
        lowerText.includes("question") ||
        lowerText.includes("help")
    ) {
        renderFAQs();
        return;
    }

    if (
        /^(hi|hello|hey|start|namaskaram)\b/.test(lowerText)
    ) {
        appendMessage(
            "Hello! Welcome to RailMate. 🚆",
            "bot"
        );

        renderStateChips();
        return;
    }

    const matchedState = states.find(
        state => state.toLowerCase() === lowerText
    );

    if (matchedState) {
        await showTrainTimingsForState(matchedState);
        return;
    }

    const trainNumberMatch = text.match(/^\d{4,6}$/);

    if (trainNumberMatch) {
        await getSingleTrain(text);
        return;
    }

    appendMessage(
        "I didn't recognize that request. Select a state, enter a train number, or choose FAQ / Questions.",
        "bot"
    );

    renderStateChips();
}

/* =====================================================
   14. GET ONE TRAIN BY NUMBER
   ===================================================== */

async function getSingleTrain(trainNo) {
    showTyping();

    try {
        const response = await fetch(
            `${API_BASE}/trains/${encodeURIComponent(trainNo)}`,
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        const text = await response.text();

        if (response.status === 404) {
            hideTyping();

            appendMessage(
                `Train ${trainNo} was not found in the database.`,
                "bot"
            );

            return;
        }

        if (!response.ok) {
            throw new Error(`API returned HTTP ${response.status}: ${text.slice(0, 150)}`);
        }

        const train = JSON.parse(text);

        if (!train || typeof train !== "object" || Array.isArray(train)) {
            throw new Error("The API did not return a single train object.");
        }

        hideTyping();

        const normalized = normalizeTrain(train);

        appendMessage(
            `Train found: ${normalized.name} (${normalized.num}). Destination: ${normalized.dest}. Departure: ${normalized.time}.`,
            "bot"
        );

        if (normalized.price !== null) {
            appendMessage(
                `Stored fare: ₹${normalized.price} per person.`,
                "bot"
            );
        } else {
            appendMessage(
                "No valid fare is stored for this train.",
                "bot"
            );
        }

    } catch (error) {
        hideTyping();

        console.error("Single train API error:", error);

        appendMessage(
            `Unable to retrieve train ${trainNo}. ${error.message}`,
            "bot"
        );

    } finally {
        hideTyping();
    }
}

/* =====================================================
   15. PROCESS USER INPUT
   ===================================================== */

function processUserMessage() {
    const text = userInput.value.trim();

    if (!text) {
        return;
    }

    appendMessage(text, "user");

    userInput.value = "";

    handleBotResponse(text).catch(error => {
        console.error("Chat handler error:", error);
        hideTyping();

        appendMessage(
            "Something went wrong while processing your request. Please try again.",
            "bot"
        );
    });
}

sendBtn.addEventListener("click", processUserMessage);

userInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        processUserMessage();
    }
});

/* =====================================================
   16. INITIALIZATION
   ===================================================== */

window.addEventListener("load", () => {
    animTrain.style.animation =
        "driveIntroTrain 4s linear forwards";

    document.querySelectorAll(".intro-wheel").forEach(wheel => {
        wheel.style.animation =
            "rotateWheel 1s linear infinite";
    });

    setTimeout(() => {
        introLayer.style.opacity = "0";

        setTimeout(() => {
            introLayer.style.display = "none";

            chatInterface.style.opacity = "1";
            chatInterface.style.pointerEvents = "all";

            mainHeader.classList.add("visible");

            inputArea.style.display = "flex";

            setTimeout(() => {
                inputArea.style.opacity = "1";
            }, 50);

            setTimeout(() => {
                appendMessage(
                    "Hello! I am RailMate. 🚆",
                    "bot"
                );
            }, 500);

            setTimeout(() => {
                renderStateChips();
                userInput.focus();
            }, 1000);

        }, 500);

    }, 4000);
});
